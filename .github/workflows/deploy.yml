name: Deploy Feedlite

on:
  workflow_run:
    workflows:
      - Feedlite CI
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: feedlite-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.workflow_run.conclusion == 'success'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.FEEDLITE_SSH_KEY }}" > ~/.ssh/feedlite_deploy_key
          chmod 600 ~/.ssh/feedlite_deploy_key

      - name: Add VPS host key
        run: |
          ssh-keyscan -p "${{ secrets.FEEDLITE_PORT }}" "${{ secrets.FEEDLITE_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/feedlite_deploy_key \
            -p "${{ secrets.FEEDLITE_PORT }}" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "${{ secrets.FEEDLITE_USER }}@${{ secrets.FEEDLITE_HOST }}" \
            'cd ~/Feedlite && test -x ./deploy.sh && ./deploy.sh'
