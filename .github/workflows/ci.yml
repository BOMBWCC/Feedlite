name: Feedlite CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: test-password
      JWT_SECRET: test-jwt-secret-for-ci-only
      ACCESS_TOKEN_EXPIRE_DAYS: 30
      DISABLE_AUTH: "false"
      DISABLE_DOCS: "true"
      SCORER_PROVIDER: openai
      SCORER_MODEL: gpt-4o-mini
      SCORER_API_BASE: https://example.com/v1
      SCORER_API_KEY: test-key
      PROFILER_PROVIDER: openai
      PROFILER_MODEL: gpt-4o-mini
      PROFILER_API_BASE: https://example.com/v1
      PROFILER_API_KEY: test-key
      AI_SPECIFIC_PROXY: ""
      RAG_API_KEY: test-rag-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare local config
        run: |
          cp config.example.yml config.yml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall app tests

      - name: Run tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Docker build check
        run: |
          docker build -t feedlite-ci .
